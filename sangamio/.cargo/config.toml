# Default target commented out to allow host builds for simulation
# Uncomment for deployment builds, or use: cargo build --target armv7-unknown-linux-musleabihf
# [build]
# target = "armv7-unknown-linux-musleabihf"

[target.armv7-unknown-linux-musleabihf]
linker = "armv7-unknown-linux-musleabihf-gcc"
rustflags = ["-C", "target-feature=+neon", "-C", "target-cpu=cortex-a7"]

# Roborock S5 Max stock firmware uses glibc/gnueabihf, not musl.
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"
rustflags = ["-C", "target-feature=+neon", "-C", "target-cpu=cortex-a7"]
